[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-intelligence"
version = "0.1.0"
description = "A Grok-Powered, Fetch.ai-Compatible Football Analytics and Odds Intelligence Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal AI Engineer" }
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
